name: Daily Dashboard Update

on:
  schedule:
    - cron: "0 8 * * 1-5"   # Mon-Fri 8:00 UTC = 4:00 PM Taiwan
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update dashboard (prices + indicators + signals)
        run: python ci_update.py

      - name: Commit updated files
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dashboard.html series_map.json
          git diff --staged --quiet || git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
          git push